name: yaya notifications
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      tick:
        description: 'הפעלה אוטומטית מהשירות החיצוני (כל 5 דקות)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: yaya-push
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore sign-in
        uses: actions/cache@v4
        with:
          path: .state
          key: yaya-state-${{ github.run_id }}
          restore-keys: yaya-state-
      - run: npm install --no-save --silent web-push@3
      - run: node push/send.mjs
        env:
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          SHOW_ADV: ${{ github.event_name == 'workflow_dispatch' && inputs.tick == '' && '1' || '' }}
      - name: Keep schedule alive
        # GitHub מכבה הרצות מתוזמנות במאגר פומבי אחרי 60 יום בלי שינויים (r5_60)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "yaya-bot"
            git config user.email "yaya-bot@users.noreply.github.com"
            git add .keepalive
            git commit -m "שמירה על ההתראות פעילות"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
      - name: Save development request
        run: |
          if [ -f dev/request.json ] && [ -n "$(git status --porcelain dev)" ]; then
            git config user.name "yaya-bot"
            git config user.email "yaya-bot@users.noreply.github.com"
            git add dev/request.json
            git commit -m "בקשת פיתוח מהאפליקציה"
            git pull --rebase -q origin main && git push -q origin HEAD:main
          fi
