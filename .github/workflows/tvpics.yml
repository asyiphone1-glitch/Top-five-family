name: yaya tv pictures (one-off)
on:
  push:
    branches: [main]
    paths: ['push/tvpics.key']
permissions:
  contents: write
concurrency:
  group: yaya-push
  cancel-in-progress: false
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore sign-in
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: yaya-state-x
          restore-keys: yaya-state-
      - run: npm install --no-save --silent jpeg-js@0.4.4
      - run: node push/tvpics.mjs
        env:
          FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Save result
        run: |
          git config user.name "yaya-bot"; git config user.email "yaya-bot@users.noreply.github.com"
          git add push/tvpics.done
          if [ -n "$(git status --porcelain push)" ]; then git commit -qm "תמונות לתצוגה: תוצאה" && git pull --rebase -q origin main && git push -q origin HEAD:main; fi
